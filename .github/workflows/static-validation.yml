name: Static validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: node --check app.js
        run: node --check app.js

      - name: node --check document-detector.js
        run: node --check document-detector.js

      - name: node --check sw.js
        run: node --check sw.js

      - name: Regression harness (DocumentDetector ML + Fallback)
        run: node scripts/regression_ml_detector.js

      - name: Regression harness (export snapshot / busy lock)
        run: node scripts/regression_export_busy.js

      - name: Regression harness (Scan ID front/back / A4 / busy lock)
        run: node scripts/regression_scan_id.js

      - name: Regression harness (Service Worker update safety)
        run: node scripts/regression_sw_update.cjs

      - name: Static validation (JSON/AST/assets/privacy boundary)
        run: python3 scripts/validate_static.py
