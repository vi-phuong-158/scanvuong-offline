name: Static validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: node --check app.js
        run: node --check app.js

      - name: node --check document-detector.js
        run: node --check document-detector.js

      - name: node --check party-pdf.js
        run: node --check party-pdf.js

      - name: node --check party-mode.js
        run: node --check party-mode.js

      - name: node --check party-taxonomy.js
        run: node --check party-taxonomy.js

      - name: node --check watermark-mode.js
        run: node --check watermark-mode.js

      - name: Regression harness (Party Mode PDF copy / hybrid / taxonomy)
        run: node scripts/regression_party_mode.cjs

      - name: Regression harness (Lossless Watermark Stripping)
        run: node scripts/regression_watermark.cjs

      - name: node --check sw.js
        run: node --check sw.js

      - name: Regression harness (DocumentDetector ML + Fallback)
        run: node scripts/regression_ml_detector.js

      - name: Regression harness (export snapshot / busy lock)
        run: node scripts/regression_export_busy.js

      - name: Regression harness (Scan ID front/back / A4 / busy lock)
        run: node scripts/regression_scan_id.js

      - name: Regression harness (Service Worker update safety)
        run: node scripts/regression_sw_update.cjs

      - name: Discover Chromium executable
        run: |
          command -v google-chrome || true
          command -v google-chrome-stable || true
          command -v chromium || true
          command -v chromium-browser || true

      - name: Chromium Party Mode UI acceptance (mobile + desktop)
        run: node scripts/acceptance_party_ui.cjs

      - name: Mobile touch-target regression (>=44px hit areas across 5 viewports)
        run: node scripts/test_touch_targets.cjs

      - name: Benchmark engine unit tests (dependency-free)
        run: node scripts/test_benchmark_engine.cjs

      - name: Real-World Pilot Pipeline unit tests (dependency-free)
        run: node scripts/test_pilot_pipeline.cjs

      - name: Install benchmark dev dependencies
        run: npm ci --prefix benchmark

      - name: Synthetic Hard-Case Benchmark Gate
        run: node scripts/benchmark_hard_cases.cjs --synthetic-only

      - name: Static validation (JSON/AST/assets/privacy boundary)
        run: python3 scripts/validate_static.py
